    filament_notes: "Ultrafuse TPU 95A for the standard 0.4 mm nozzle on T6 of the mixed-nozzle INDX printers. Temperatures, bed and cooling from BASF's own Prusa profile for this filament (MK4 IS v1.1, 2024): 225 C (230 first layer), bed 40, fan 20-100 percent automatic. Retract 1.5 and cap 2 mm3/s from Prusa's INDX TPU profile, flow 1.06 from the HF 0.4 tune.\n\nMaterial Description\nUltrafuse® TPU 95A comes with a well-balanced profile of flexibility and durability. On top of that, it allows for easier and faster printing then softer TPU grades. Parts printed with Ultrafuse® TPU 95A show a high elongation, good impact resistance, excellent layer adhesion and a good resistance to oils and common industrially used chemicals. Due to its good printing behavior, Ultrafuse® TPU 95A is a good choice for starting printing flexible materials on both direct drive and bowden style printers.\n\nPrinting Recommendations:\nUltrafuse TPU can be printed directly onto a clean build plate. A small amount of 3Dlac can make removal easier after printing."
